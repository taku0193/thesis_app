server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Chrome DevTools probes this optional endpoint automatically. The app
    # does not expose DevTools workspace metadata, so acknowledge the probe
    # without logging a missing-file error.
    location = /.well-known/appspecific/com.chrome.devtools.json {
        access_log off;
        log_not_found off;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
